<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patternix: DSA patterns as a game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eaf0f7;--surface:#ffffff;--ink:#14213d;--muted:#5d6987;--line:#d5deeb;--chip:#e3eaf4;--code:#f2f5fa;
  --primary:#2f5bff;--primary-soft:#e2e9ff;--sun:#ffc93c;--sun-ink:#7a5300;
  --good:#0f9d63;--good-soft:#d9f4e8;--bad:#e5484d;--bad-soft:#fde4e4;
  --L:#0f9d9d;--R:#8a4dff;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1330;--surface:#141d40;--ink:#eef2ff;--muted:#98a3c7;--line:#26315a;--chip:#1d2750;--code:#0f1736;
  --primary:#6b8bff;--primary-soft:#1f2b63;--sun:#ffd25c;--sun-ink:#ffd25c;
  --good:#35d08f;--good-soft:#123b33;--bad:#ff6b70;--bad-soft:#3f1d2a;--L:#35cfcf;--R:#b18cff;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1330;--surface:#141d40;--ink:#eef2ff;--muted:#98a3c7;--line:#26315a;--chip:#1d2750;--code:#0f1736;
  --primary:#6b8bff;--primary-soft:#1f2b63;--sun:#ffd25c;--sun-ink:#ffd25c;
  --good:#35d08f;--good-soft:#123b33;--bad:#ff6b70;--bad-soft:#3f1d2a;--L:#35cfcf;--R:#b18cff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed}
#app{max-width:540px;margin:0 auto;padding:16px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 18px}
.logo{font-weight:800;font-size:26px;letter-spacing:-.03em;display:flex;align-items:center}
.logo i{font-style:normal;color:var(--primary)}
.pills{display:flex;gap:8px}
.pill{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
h2{font-size:19px;margin:0;letter-spacing:-.01em}
.sec{font-size:15px;font-weight:600;color:var(--muted);margin:24px 2px 10px}
.muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.radar{width:100%;max-width:360px;display:block;margin:2px auto}
.radar .rl{font-size:11px;fill:var(--muted);font-family:"Bricolage Grotesque",sans-serif}
.radar .rv{font-size:13px;font-weight:800;fill:var(--ink);font-family:"Bricolage Grotesque",sans-serif}
.mode{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;transition:transform .12s}
.mode:active{transform:scale(.98)}
.micon{font-size:24px;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--primary-soft);flex:none}
.mode .mt{flex:1}
.mode b{display:block;font-size:17px}
.mode small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.go{font-size:26px;color:var(--muted)}
.tier{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.tier{display:block;width:100%;text-align:left}
.prow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 2px;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:none}
.prow .pn{flex:1;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--chip)}
.badge{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--good-soft);color:var(--good)}
.badge.lock{background:var(--chip);color:var(--muted)}
.bar{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:10px;margin-bottom:12px}
.back{width:42px;height:42px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:24px;line-height:1}
.title{text-align:center;font-weight:800;font-size:18px}
.timer{height:10px;background:var(--chip);border-radius:99px;overflow:hidden}
.timer>div{height:100%;width:100%;background:var(--primary);border-radius:99px}
.timer>div.low{background:var(--bad)}
.score{font-weight:800;font-size:24px;text-align:right}
.label{font-size:13px;color:var(--muted);font-weight:600}
.ptext{font-size:22px;line-height:1.3;font-weight:600;margin:10px 0 6px;min-height:3.9em;letter-spacing:-.01em}
.opts{display:grid;gap:10px}
.grid2{grid-template-columns:1fr 1fr}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;font-weight:600;font-size:15px;min-height:56px;transition:transform .1s,background .15s}
.opt:active{transform:scale(.97)}
.opt.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;text-align:left;font-size:14px}
.opt.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.combo{text-align:center;height:26px;font-weight:800;color:var(--sun-ink)}
.combo span{background:var(--sun);color:#3b2a00;padding:2px 10px;border-radius:999px;font-size:14px}
.code{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:13px;line-height:1.65;background:var(--code);border:1px solid var(--line);border-radius:12px;padding:10px 8px;margin:10px 0;overflow-x:auto;white-space:pre}
.code .ln{display:block;padding:0 6px;border-radius:5px}
.code.num{counter-reset:ln}
.code.num .ln::before{counter-increment:ln;content:counter(ln);display:inline-block;width:1.7em;color:var(--muted);opacity:.7}
.code .ln.hi{background:var(--primary-soft);box-shadow:inset 3px 0 0 var(--primary)}
.code .k{color:var(--R);font-weight:600}.code .s{color:var(--good)}.code .n{color:var(--primary)}.code .c{color:var(--muted);font-style:italic}.code .b{color:var(--L)}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;color:#fff;white-space:nowrap}
.qtext{font-weight:600;font-size:17px;margin:6px 0 2px}
.primary{background:var(--primary);color:#fff;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 16px;font-weight:600}
.ghost.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.block{display:block;width:100%;margin-top:12px}
.actions{display:grid;gap:10px;margin-top:14px}
.actions .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:76px;font-weight:800;line-height:1;letter-spacing:-.04em;margin:8px 0 4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stats div{background:var(--chip);border-radius:14px;padding:10px 6px}
.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:var(--muted)}
.vs{display:flex;align-items:center;justify-content:space-around;padding:24px 12px}
.side{display:flex;flex-direction:column;align-items:center;gap:4px}
.av{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-weight:800;font-size:22px;margin-bottom:4px}
.av.you{background:var(--primary);color:#fff}.av.bot{background:var(--sun);font-size:30px}
.vsx{font-size:28px;font-weight:800;color:var(--muted)}
.duelscore{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.duelscore b{font-size:20px}
.botline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin:10px 2px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);animation:pulse 1s infinite}
.dot.on{background:var(--good);animation:none}.dot.bad{background:var(--bad);animation:none}
@keyframes pulse{50%{opacity:.3}}
.fb{margin-top:12px}.fb p{margin:6px 0 0;line-height:1.45}
.fb.good{border-color:var(--good)}.fb.badc{border-color:var(--bad)}
.fb.good b{color:var(--good)}.fb.badc b{color:var(--bad)}
.rounds{display:grid;gap:6px;margin-top:10px}
.rounds div{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:8px 10px;background:var(--chip);border-radius:10px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1px solid var(--line);padding:5px;border-radius:14px;margin-bottom:12px}
.tabs button{padding:10px;border-radius:10px;font-weight:600}
.tabs button.on{background:var(--primary);color:#fff}
.target{font-size:16px;margin:10px 0}.target b{font-size:22px}
.cells{display:flex;gap:6px;justify-content:center;margin:14px 0 4px;overflow-x:auto}
.cellw{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:34px;max-width:52px}
.cell{width:100%;aspect-ratio:1;display:grid;place-items:center;font-weight:800;font-size:18px;border-radius:12px;background:var(--chip);border:2px solid transparent;transition:all .2s}
.cell.act{background:var(--primary-soft);border-color:var(--primary)}
.cell.dim{opacity:.3}
.cell.win{background:var(--primary-soft);border-color:var(--primary)}
.cell.out{border-color:var(--bad);border-style:dashed}
.cell.in{border-color:var(--good);border-style:dashed;background:var(--good-soft)}
.ptr{height:20px;font-weight:800;font-size:13px}
.ptr .L{color:var(--L)}.ptr .R{color:var(--R)}
.sumline{text-align:center;font-size:15px;margin:6px 0}
.sumline b{font-size:18px}
.msg{min-height:44px;font-size:14px;line-height:1.4;margin:8px 0;text-align:center}
.good{color:var(--good)}.bad{color:var(--bad)}
.ctrl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ctrl .opt{font-size:14px;padding:10px 6px}
.labnav{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:6px;scrollbar-width:none}
.labnav::-webkit-scrollbar{display:none}
.labnav button{white-space:nowrap;padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px}
.labnav button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.viz{margin-top:6px}
.kvs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.kv{background:var(--chip);border-radius:10px;padding:6px 10px;font-size:13px}
.rowlab{font-size:12px;color:var(--muted);font-weight:600;text-align:center;margin:10px 0 -6px}
.grid3{grid-template-columns:repeat(3,1fr)}
.ptr{height:auto;min-height:20px;font-size:12px;white-space:nowrap}
.cell.arrow{background:transparent;aspect-ratio:auto;height:30px;font-size:20px;color:var(--muted)}
.center-chips{justify-content:center;margin:10px 0}
.chip.dimc{opacity:.4}.chip.on{background:var(--primary);color:#fff}
.tl{margin:6px 0}.tlrow{position:relative;height:32px}
.tlbar{position:absolute;top:16px;height:12px;border-radius:6px;background:var(--chip);border:2px solid var(--line)}
.tlbar.cur{background:var(--primary-soft);border-color:var(--primary)}.tlbar.done{opacity:.35}
.tlbar.merged{background:var(--good-soft);border-color:var(--good)}
.tll{position:absolute;top:0;font-size:11px;color:var(--muted);white-space:nowrap}
.tree .lv{display:flex;justify-content:space-around;margin:10px 0}
.tn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--chip);border:2px solid transparent}
.tn.win{background:var(--primary-soft);border-color:var(--primary)}
.tn.in{background:var(--good-soft);border-color:var(--good);border-style:dashed}
.tn.ghost{visibility:hidden}
.trie{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:15px;background:var(--code);border:1px solid var(--line);border-radius:12px;padding:8px;margin:10px 0;max-height:240px;overflow:auto}
.tline{padding:2px 6px;border-radius:5px}.tline.on{background:var(--primary-soft)}
.bits{display:flex;flex-direction:column;align-items:center;gap:4px;margin:10px 0;font-size:15px}
.bits code{font-family:"JetBrains Mono",monospace;font-size:20px;letter-spacing:.18em}
.opt code{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.miss p{margin:0 0 8px;font-weight:600}
.link{display:block;margin:26px auto 0;color:var(--muted);font-size:13px;text-decoration:underline}
.prompt{font-size:16px;text-align:center;line-height:1.45;margin:10px 0}
.win-sum{display:flex;justify-content:center;gap:22px;font-size:15px;margin:6px 0}
.win-sum b{font-size:20px}
.diff{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.diff.h{background:var(--bad-soft);color:var(--bad)}
.step{display:grid;place-items:center;min-width:26px;height:26px;border-radius:8px;background:var(--primary);color:#fff;font-weight:800;font-size:13px}
.sname{font-size:15px}
.brow .lcchip{font-size:11px;padding:2px 7px}
.diff.e{background:var(--good-soft);color:var(--good)}.diff.m{background:#fff1cc;color:#8a5a00}
:root[data-theme="dark"] .diff.m{background:#3a2e10;color:var(--sun)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .diff.m{background:#3a2e10;color:var(--sun)}}
.lcchip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.lcline{display:flex;gap:6px;align-items:center;margin-top:8px}
#meta{display:flex;gap:6px;align-items:center}
.lclink{display:inline-block;margin-top:8px;color:var(--primary);font-weight:600;font-size:14px;text-decoration:none}
.bank summary{display:flex;align-items:center;gap:8px;cursor:pointer;list-style:none}
.bank summary::-webkit-details-marker{display:none}
.bank summary::after{content:"▾";color:var(--muted);margin-left:8px}
.bank[open] summary::after{content:"▴"}
.brow{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line);font-size:14px}
.brow:first-of-type{margin-top:10px}
.brow a{flex:1;color:var(--ink);text-decoration:none;font-weight:500}
.brow input{width:20px;height:20px;accent-color:var(--good);flex:none}

/* ---- graphics upgrade ---- */
.card{box-shadow:0 1px 2px rgba(20,33,61,.05),0 10px 28px rgba(20,33,61,.07)}
.hero{background:radial-gradient(130% 110% at 100% 0%,var(--primary-soft),var(--surface) 62%)}
.lm{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--primary),#8a4dff);color:#fff;font-size:18px;margin-right:9px;box-shadow:0 6px 14px rgba(47,91,255,.35)}
.mode{box-shadow:0 1px 2px rgba(20,33,61,.05),0 8px 22px rgba(20,33,61,.06);transition:transform .15s,box-shadow .15s}
@media (hover:hover){.mode:hover,.tier:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(20,33,61,.12)}}
.micon.c1{background:linear-gradient(135deg,#2f5bff,#7b96ff)}.micon.c2{background:linear-gradient(135deg,#ffb020,#ffd25c)}
.micon.c3{background:linear-gradient(135deg,#0f9d63,#4fd39a)}.micon.c4{background:linear-gradient(135deg,#8a4dff,#c3a2ff)}
.micon{box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.tier{transition:transform .15s,box-shadow .15s}
.opt{border-bottom-width:4px;box-shadow:0 2px 0 rgba(20,33,61,.03)}
.opt:active{transform:translateY(2px);border-bottom-width:2px}
.primary{box-shadow:0 4px 0 #1d3fc4,0 10px 22px rgba(47,91,255,.28);transition:transform .08s,box-shadow .08s}
.primary:active{transform:translateY(3px);box-shadow:0 1px 0 #1d3fc4}
.timer>div{background:linear-gradient(90deg,var(--primary),#8a4dff)}
.big{background:linear-gradient(135deg,var(--primary),#8a4dff);-webkit-background-clip:text;background-clip:text;color:transparent}
.cell{box-shadow:inset 0 -3px 0 rgba(0,0,0,.07)}
.cell.act{transform:translateY(-3px);box-shadow:0 8px 16px rgba(47,91,255,.28);animation:pop .3s both}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08) translateY(-3px)}100%{transform:translateY(-3px)}}
.score.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.35);color:var(--good)}}
.enter>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}
.enter>*:nth-child(5){animation-delay:.16s}.enter>*:nth-child(6){animation-delay:.2s}.enter>*:nth-child(n+7){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.gsvg{width:100%;display:block;margin:6px auto 2px;overflow:visible}
.gsvg text{text-anchor:middle;dominant-baseline:middle;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:14px;fill:var(--ink)}
.gsvg .gs{font-size:11px;font-weight:600;fill:var(--muted)}
.gsvg .gt{font-size:11px;font-weight:800;fill:var(--primary)}
.gn circle{fill:var(--chip);stroke:var(--line);stroke-width:2.5;transition:fill .25s,stroke .25s}
.gn.win circle{fill:var(--primary-soft);stroke:var(--primary)}
.gn.in circle{fill:var(--good-soft);stroke:var(--good);stroke-dasharray:5 3}
.gn.act circle{fill:var(--primary);stroke:var(--primary);filter:drop-shadow(0 4px 8px rgba(47,91,255,.4))}
.gn.act .gl{fill:#fff}
.gsvg .gs,.gsvg .gt{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.ge{stroke:var(--muted);stroke-width:2;opacity:.6;fill:none}
.ge.dim{opacity:.15}.ge.on{stroke:var(--primary);stroke-width:3.5;opacity:1}
.ge.good{stroke:var(--good);stroke-width:3;opacity:1}.ge.bad{stroke:var(--bad);stroke-width:3.5;opacity:1;stroke-dasharray:6 4}
.ge.loop{stroke:var(--R);opacity:.9;stroke-dasharray:5 4}
.ahp{fill:var(--muted)}
.gw rect{fill:var(--surface);stroke:var(--line)}.gw text{font-size:12px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s cubic-bezier(.25,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}
.trie{border-left:4px solid var(--primary)}
.tline{position:relative}
.tlbar{box-shadow:inset 0 -2px 0 rgba(0,0,0,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card,:root:not([data-theme="light"]) .mode{box-shadow:0 10px 28px rgba(0,0,0,.35)}}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .mode{box-shadow:0 10px 28px rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------------- data ---------------- */

function playRoulette(level,tier){

  const missed=[];

  function next(){

    const opts=shuffle([cur.p,...near.concat(far).slice(0,3)]);
    $("#meta").innerHTML=`<span class="lcchip">LC ${cur.num}</span> ${diffPill(cur.diff)}`;
    $("#pt").textContent=cur.text;
    $("#op").innerHTML=opts.map(o=>`<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join("");
    $$("#op .opt").forEach(b=>b.onclick=()=>answer(b));

  }
  function answer(b){

    app.innerHTML=`<section class="card center" style="padding:24px 16px">
      <div class="label">Time's up, ${tp?TIERS[tier][0]+" tier":level.toLowerCase()+" level"}</div><div class="big">${score}</div>
      <div class="muted">patterns named in 60 seconds${newBest&&score>0?`<br><b class="good">New personal best</b>`:""}</div>
      <div class="stats"><div><b>${acc}%</b><span>accuracy</span></div><div><b>${maxCombo}</b><span>best streak</span></div><div><b>${delta>=0?"+":""}${delta}</b><span>recognition</span></div></div>
    </section>

const LABS={};
LABS["Hashing"]={title:"Two Sum with a hashmap",lc:1,blurb:"Walk the array once. For each number, ask: have I already seen its partner?",
code:"seen = {}\nfor i, x in enumerate(nums):\n    if t - x in seen:\n        return seen[t - x], i\n    seen[x] = i",
init(){const a=distinct(7,1,20);const i=rnd(0,5),j=rnd(i+1,6);return{a,t:a[i]+a[j],i:0,seen:{},found:null};},

q(s){const x=s.a[s.i],need=s.t-x,has=need in s.seen;return{prompt:`x = ${x}. Partner needed: ${s.t} − ${x} = <b>${need}</b>. Is it in seen?`,opts:["Yes: return the pair","No: store x, move on"],ans:has?0:1,hint:has?`${need} is already in seen (index ${s.seen[need]}).`:`${need} hasn't been seen yet, so remember ${x} for later.`};},
step(s){const x=s.a[s.i],need=s.t-x;if(need in s.seen){s.found=[s.seen[need],s.i];return{msg:`Found: indices ${s.found[0]} and ${s.i}`,hi:3};}s.seen[x]=s.i;s.i++;return{msg:`Stored ${x} → index ${s.i-1}`,hi:4};},

LABS["Prefix Sum"]={title:"Range sums in O(1)",lc:303,blurb:"Build running totals once, then answer each range query with one subtraction.",
code:"p = [0]\nfor x in a:\n    p.append(p[-1] + x)\n# sum of a[l..r]\nans = p[r + 1] - p[l]",
init(){const a=Array.from({length:7},()=>rnd(1,9));const p=[0];a.forEach(x=>p.push(p[p.length-1]+x));const qs=[];while(qs.length<4){const l=rnd(0,5),r=rnd(l+1,6);qs.push([l,r]);}return{a,p,qs,qi:0};},

q(s){const[l,r]=s.qs[s.qi],P=s.p;const c=shuffle([[`p[${r+1}] − p[${l}] = ${P[r+1]-P[l]}`,1],[`p[${r}] − p[${l}] = ${P[r]-P[l]}`,0],[`p[${r+1}] − p[${l+1}] = ${P[r+1]-P[l+1]}`,0]]);return{prompt:`Sum of a[${l}..${r}], inclusive?`,opts:c.map(x=>x[0]),ans:c.findIndex(x=>x[1]),hint:`p[i] is the sum of the first i elements. The range ends at a[${r}], so use p[${r+1}], and starts at a[${l}], so subtract p[${l}].`};},
step(s){const[l,r]=s.qs[s.qi];s.qi++;return{msg:`a[${l}..${r}] sums to ${s.p[r+1]-s.p[l]}`,hi:4};},

LABS["Binary Search"]={title:"Binary search",lc:704,blurb:"The array is sorted. Check the middle and throw away the half that can't hold the target.",
code:"lo, hi = 0, len(a) - 1\nwhile lo <= hi:\n    mid = (lo + hi) // 2\n    if a[mid] == t: return mid\n    if a[mid] < t: lo = mid + 1\n    else: hi = mid - 1",
init(){const a=distinct(11,1,60).sort((x,y)=>x-y);let t;if(Math.random()<.75)t=a[rnd(0,10)];else{do{t=rnd(1,60);}while(a.includes(t));}return{a,t,lo:0,hi:10,res:undefined};},
view(s){const live=s.lo<=s.hi&&s.res===undefined,mid=(s.lo+s.hi)>>1;return `<div class="target center">Target <b>${s.t}</b></div>`+cellsH(s.a,(v,k)=>s.res>=0&&k===s.res?"win":(k<s.lo||k>s.hi)?"dim":(live&&k===mid?"act":""),(v,k)=>live?[k===s.lo?PL("lo"):"",k===mid?"mid":"",k===s.hi?PR("hi"):""].filter(Boolean).join(" "):"");},
q(s){const opts=["‹ Go left","Found it","Go right ›","Not in array"];if(s.lo>s.hi)return{prompt:"lo has moved past hi.",opts,ans:3,hint:"The search range is empty, so the target isn't there."};const mid=(s.lo+s.hi)>>1,v=s.a[mid];return{prompt:`a[mid] = <b>${v}</b>, target ${s.t}`,opts,ans:v===s.t?1:v<s.t?2:0,hint:v===s.t?"The middle value is the target.":v<s.t?`${v} < ${s.t}, so the target can only be to the right.`:`${v} > ${s.t}, so the target can only be to the left.`};},
step(s,i){if(s.lo>s.hi){s.res=-1;return{msg:"Not found",hi:1};}const mid=(s.lo+s.hi)>>1;if(i===1){s.res=mid;return{msg:`Found at index ${mid}`,hi:3};}if(i===2){s.lo=mid+1;return{msg:"lo = mid + 1",hi:4};}s.hi=mid-1;return{msg:"hi = mid − 1",hi:5};},
done:s=>s.res!==undefined,end:s=>s.res>=0?`<b>Found ${s.t} at index ${s.res}</b><br>At most 4 checks for 11 items. Linear search could need 11.`:`<b>${s.t} is not in the array</b><br>Proved in at most 4 checks.`};
LABS["Stack"]={title:"Next greater element",lc:496,blurb:"The stack holds numbers still waiting for something bigger. A bigger number pops them and becomes their answer.",
code:"ans = [-1] * len(a)\nst = []\nfor i, x in enumerate(a):\n    while st and a[st[-1]] < x:\n        ans[st.pop()] = x\n    st.append(i)",
init(){return{a:Array.from({length:7},()=>rnd(1,9)),i:0,st:[],ans:Array(7).fill(-1)};},
view(s){return cellsH(s.a,(v,k)=>k===s.i?"act":s.st.includes(k)?"in":"",(v,k)=>k===s.i?PL("x"):"")+kv([["stack",s.st.length?"["+s.st.map(k=>s.a[k]).join(", ")+"] ← top":"empty"]])+`<div class="rowlab">ans</div>`+cellsH(s.ans,v=>v>0?"win":"");},
q(s){const x=s.a[s.i],top=s.st.length?s.a[s.st[s.st.length-1]]:null,pop=top!==null&&top<x;return{prompt:`x = <b>${x}</b>, top of stack = <b>${top===null?"empty":top}</b>`,opts:["Pop: x answers the top","Push x"],ans:pop?0:1,hint:pop?`${top} < ${x}, so ${x} is ${top}'s next greater. Pop it.`:top===null?"The stack is empty, so push x.":`${top} ≥ ${x}, so x can't answer it. Push x and keep waiting.`};},
step(s,i){if(i===0){const j=s.st.pop();s.ans[j]=s.a[s.i];return{msg:`Answer for ${s.a[j]} is ${s.a[s.i]}`,hi:4};}s.st.push(s.i);s.i++;return{msg:"Pushed",hi:5};},

LABS["Monotonic Queue"]={title:"Sliding window maximum",lc:239,blurb:"Window size 3. The deque keeps indices with decreasing values, so its front is always the window max.",
code:"for i, x in enumerate(a):\n    if dq and dq[0] <= i - k: dq.popleft()\n    while dq and a[dq[-1]] <= x: dq.pop()\n    dq.append(i)\n    if i >= k - 1: out.append(a[dq[0]])",
init(){return{a:Array.from({length:8},()=>rnd(1,9)),k:3,i:0,dq:[],out:[]};},
view(s){return cellsH(s.a,(v,j)=>j===s.i?"act":(j>s.i-s.k&&j<s.i)?"win":"",(v,j)=>j===s.i?PL("x"):s.dq.includes(j)?PR("dq"):"")+kv([["deque",s.dq.length?"front ["+s.dq.map(j=>s.a[j]).join(", ")+"] back":"empty"],["maxes",s.out.length?s.out.join(", "):"–"]]);},
q(s){const x=s.a[s.i],dq=s.dq,front=dq.length>0&&dq[0]<=s.i-s.k,back=!front&&dq.length>0&&s.a[dq[dq.length-1]]<=x;const ans=front?0:back?1:2;return{prompt:`x = a[${s.i}] = <b>${x}</b>`,opts:["Drop front (left the window)","Pop back (≤ x)","Push x"],ans,hint:["The front index has slid out of the window. Drop it first.",`The back value ${dq.length?s.a[dq[dq.length-1]]:""} ≤ ${x}, so it can never be a max again. Pop it.`,"Nothing to remove, so push x."][ans]};},

done:s=>s.i>=s.a.length,end:s=>`<b>Window maxima: ${s.out.join(", ")}</b><br>Every index enters and leaves the deque once: O(n).`};

code:"far = 0\nfor i, x in enumerate(nums):\n    if i > far: return False\n    far = max(far, i + x)\n    if far >= len(nums) - 1: return True",

const TPCODE="while l < r:\n    s = a[l] + a[r]\n    if s == t: return l, r\n    if s < t: l += 1\n    else: r -= 1";
function TwoPtr(){
  let a,t,l,r,moves,mist;
  function gen(){
    const set=new Set();while(set.size<7)set.add(1+Math.floor(Math.random()*24));
    a=[...set].sort((x,y)=>x-y);
    const i=Math.floor(Math.random()*6),j=i+1+Math.floor(Math.random()*(6-i));
    t=a[i]+a[j];l=0;r=a.length-1;moves=0;mist=0;draw("Your move. Compare the sum to the target.",-1);
  }
  function cells(){return a.map((v,k)=>`<div class="cellw"><div class="cell ${k===l||k===r?"act":""} ${k<l||k>r?"dim":""}">${v}</div><div class="ptr">${k===l?'<span class="L">L</span>':""}${k===r?'<span class="R">R</span>':""}</div></div>`).join("");}
  function draw(msg,hi){
    const s=a[l]+a[r];
    $("#lab").innerHTML=`<section class="card" id="tpc">
      <p class="muted small" style="margin:0">Sorted array. Find two numbers that add to the target. You are the algorithm.</p>
      <div class="target">Target <b>${t}</b></div>
      <div class="cells">${cells()}</div>
      <div class="sumline">${a[l]} + ${a[r]} = <b>${s}</b></div>
      ${codeBlock(TPCODE,false,hi)}
      <div class="msg">${msg}</div>
      <div class="ctrl"><button class="opt" id="mL">Move L ›</button><button class="opt" id="fd">Found ✓</button><button class="opt" id="mR">‹ Move R</button></div>
      <p class="muted small center" style="margin:10px 0 0">Moves ${moves}, mistakes ${mist}</p></section>`;
    $("#mL").onclick=()=>act("L");$("#fd").onclick=()=>act("F");$("#mR").onclick=()=>act("R");
  }
  function act(x){
    const s=a[l]+a[r],need=s===t?"F":s<t?"L":"R";
    if(x!==need){
      mist++;
      const hint=need==="F"?`${s} equals ${t}. You already found it.`:s<t?`${s} is less than ${t}. Moving L right picks a bigger number.`:`${s} is more than ${t}. Moving R left picks a smaller number.`;
      draw(`<span class="bad">✗ ${hint}</span>`,-1);$("#tpc").classList.add("shake");return;
    }
    moves++;
    if(need==="F"){
      if(!mist)confetti();bumpStreak();S.pr["Two Pointers"]=Math.max(600,S.pr["Two Pointers"]+(mist===0?10:3));save();
      $("#lab").innerHTML=`<section class="card center" style="padding:22px 16px">
        <div class="cells">${a.map((v,k)=>`<div class="cellw"><div class="cell ${k===l||k===r?"win":"dim"}">${v}</div><div class="ptr"></div></div>`).join("")}</div>
        <h2 style="margin-top:6px">${a[l]} + ${a[r]} = ${t}</h2>
        <p class="muted">Found in ${moves} moves with ${mist} mistake${mist===1?"":"s"}.<br>Brute force could check up to 21 pairs. Two pointers needs at most 6 moves.</p>
        <button class="primary block" id="np">New puzzle</button></section>
        ${codeBlock(TPCODE,false,2)}`;
      $("#np").onclick=gen;return;
    }
    if(need==="L")l++;else r--;
    draw(`<span class="good">✓ ${need==="L"?`${s} &lt; ${t}, so l += 1`:`${s} &gt; ${t}, so r -= 1`}</span>`,need==="L"?3:4);
  }
  gen();
}
const SWCODE="w = sum(a[:k]); best = w\nfor i in range(k, len(a)):\n    w += a[i] - a[i - k]\n    best = max(best, w)";
function SlideWin(){
  const k=3;let a,i,w,best,ok,tot;
  function gen(){a=Array.from({length:9},()=>1+Math.floor(Math.random()*9));w=a[0]+a[1]+a[2];best=w;i=k;ok=0;tot=0;draw("",0);}
  function draw(msg,hi){
    const fin=i>=a.length;
    $("#lab").innerHTML=`<section class="card" id="swc">
      <p class="muted small" style="margin:0">Find the max sum of any ${k} neighbours. Predict each slide before it happens.</p>
      <div class="cells">${a.map((v,j)=>{let c="";if(j>=i-k&&j<i)c="win";if(!fin&&j===i-k)c="win out";if(!fin&&j===i)c="in";return `<div class="cellw"><div class="cell ${c}">${v}</div><div class="ptr">${!fin&&j===i?'<span class="L">+</span>':""}${!fin&&j===i-k?'<span class="R">−</span>':""}</div></div>`;}).join("")}</div>
      <div class="win-sum"><span>Window <b>${w}</b></span><span>Best <b>${best}</b></span></div>
      ${codeBlock(SWCODE,false,hi)}
      <div class="msg">${msg}</div>
      ${fin?`<p class="prompt"><b>Max sum is ${best}.</b><br>You predicted ${ok} of ${tot} slides correctly, and each slide cost O(1) instead of re-adding ${k} numbers.</p><button class="primary block" id="nw">New array</button>`
      :`<p class="prompt">Slide right: add <b class="good">${a[i]}</b>, drop <b class="bad">${a[i-k]}</b>.<br>Will the new sum beat ${best}?</p>
        <div class="opts grid2"><button class="opt" id="y">Yes</button><button class="opt" id="n">No</button></div>`}
    </section>`;
    if(fin){$("#nw").onclick=gen;}else{$("#y").onclick=()=>pred(true);$("#n").onclick=()=>pred(false);}
  }
  function pred(yes){
    const add=a[i],drop=a[i-k],nw=w+add-drop,beats=nw>best,right=yes===beats;
    tot++;if(right)ok++;
    const prev=best;w=nw;if(beats)best=nw;i++;
    const text=`${w-add+drop} + ${add} − ${drop} = ${nw}, ${beats?`which beats ${prev}`:`which does not beat ${prev}`}.`;
    if(i>=a.length){bumpStreak();S.pr["Sliding Window"]=Math.max(600,S.pr["Sliding Window"]+Math.round(ok/tot*12)-3);save();}
    draw(`<span class="${right?"good":"bad"}">${right?"✓":"✗"} ${text}</span>`,beats?3:2);
    if(!right)$("#swc").classList.add("shake");
  }
  gen();
}

go(Home);
</script>
</body>
</html>
